<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Inertia rhythm demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F6F3; --bg-page: #EDEBE6; --surface: #fff;
      --ink: #1A1A1A; --muted: #5C5C5C; --faint: #8A8A8A;
      --line: #E8E8E8; --accent: #2F5D4A; --accent-soft: #E8F0EC;
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      --font: "Noto Sans TC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: #111; color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    body.demo-rhythm {}
    .phone {
      width: 390px; height: 844px; background: var(--bg-page);
      border-radius: 28px; overflow: hidden; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    .stage { position: absolute; inset: 0; padding: 48px 20px 24px; transition: opacity 0.4s; }
    .stage.hidden { opacity: 0; pointer-events: none; }
    .label-top { font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; }
    .dark {
      margin-top: 48px; background: #2a2a2c; border-radius: 14px; padding: 28px 18px;
    }
    .lock-widget {
      background: rgba(255,255,255,0.9); border-radius: 14px; padding: 14px 16px;
    }
    .lock-widget .brand { font-size: 11px; font-weight: 600; color: var(--accent); }
    .lock-widget .lab { font-size: 11px; color: var(--faint); margin-top: 8px; }
    .lock-widget .val { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .pace-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .pace { font-size: 13px; color: var(--accent); font-weight: 500; }
    .hero {
      margin-top: 24px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 8px; padding: 14px;
    }
    .hero .lab { font-size: 11px; color: var(--faint); }
    .hero .nw { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .pill {
      font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 999px;
      border: 1px solid #c5d8ce; background: var(--accent-soft); color: var(--accent);
    }
    .live { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .live strong { color: var(--accent); font-variant-numeric: tabular-nums; }
    .spark {
      margin-top: 14px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px;
    }
    .spark .cap { font-size: 11px; color: var(--faint); margin-bottom: 4px; }
    .spark svg { width: 100%; height: 56px; display: block; }
    .spark path.line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
    .spark path.fill { fill: var(--accent); opacity: 0.08; }
    .foot {
      position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
      font-size: 11px; color: var(--faint);
    }
    .rhythm-metro { display: inline-flex; align-items: flex-end; gap: 3px; height: 18px; }
    .rhythm-beat {
      display: block; width: 6px; height: 16px; border-radius: 1.5px;
      background: var(--accent); opacity: 0.32; transform-origin: center bottom;
    }
    @media (prefers-reduced-motion: no-preference) {
      .rhythm-beat { animation: rhythmBeat 1.6s ease-in-out infinite; }
      .rhythm-beat:nth-child(1) { animation-delay: 0s; }
      .rhythm-beat:nth-child(2) { animation-delay: 0.4s; }
      .rhythm-beat:nth-child(3) { animation-delay: 0.8s; }
      .rhythm-beat:nth-child(4) { animation-delay: 1.2s; }
      .pace-breathe { animation: paceBreathe 1.6s ease-in-out infinite; }
      .spark path.line.animate {
        stroke-dasharray: 520; stroke-dashoffset: 520;
        animation: drawSpark 0.7s var(--ease) forwards;
      }
    }
    @keyframes rhythmBeat {
      0%, 10% { opacity: 1; transform: scaleY(1.55); }
      20%, 100% { opacity: 0.28; transform: scaleY(1); }
    }
    @keyframes paceBreathe {
      0%, 100% { opacity: 0.7; } 50% { opacity: 1; }
    }
    @keyframes drawSpark { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rhythm-beat, .pace-breathe, .spark path.line.animate { animation: none !important; }
      .rhythm-beat { opacity: 0.4; }
    }
  </style>
</head>
<body class="demo-rhythm">
  <div class="phone" aria-label="Inertia rhythm demo">
    <div class="stage" id="stage-lock">
      <div class="label-top">Inertia · Lock preview</div>
      <div class="dark">
        <div class="lock-widget">
          <div class="brand">Inertia</div>
          <div class="lab">Net worth</div>
          <div class="val">NT$16,470,000</div>
          <div class="pace-row">
            <div class="pace pace-breathe">Month pace +NT$52k</div>
            <span class="rhythm-metro" aria-hidden="true">
              <span class="rhythm-beat"></span><span class="rhythm-beat"></span>
              <span class="rhythm-beat"></span><span class="rhythm-beat"></span>
            </span>
          </div>
        </div>
      </div>
    </div>
    <div class="stage hidden" id="stage-home">
      <div class="label-top">Inertia · Home</div>
      <div class="hero">
        <div class="lab">Net worth</div>
        <div class="nw">NT$16,470,000</div>
        <div class="meta">
          <span class="pill pace-breathe">Month pace</span>
          <span class="rhythm-metro" aria-hidden="true">
            <span class="rhythm-beat"></span><span class="rhythm-beat"></span>
            <span class="rhythm-beat"></span><span class="rhythm-beat"></span>
          </span>
        </div>
        <p class="live">Pace running <strong id="live">NT$946</strong></p>
      </div>
      <div class="spark">
        <div class="cap">30-day quiet growth pace (illustrative)</div>
        <svg viewBox="0 0 360 56" preserveAspectRatio="none" aria-hidden="true">
          <path class="fill" id="fill" d="" />
          <path class="line" id="line" d="" />
          <circle id="head" cx="0" cy="0" r="5" fill="#2F5D4A" />
        </svg>
      </div>
    </div>
    <div class="foot">Inertia rhythm demo · same motion as app · ?demo=1</div>
  </div>
  <script>
    document.body.classList.add("demo-rhythm");
    const pts = [];
    for (let i = 0; i < 30; i++) {
      const x = (i / 29) * 360;
      const bump = Math.sin(i / 4.2) * 3 + (i / 29) * 20;
      const y = Math.max(8, Math.min(50, 44 - bump));
      pts.push([x, y]);
    }
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    document.getElementById("fill").setAttribute("d", d + " L360 56 L0 56 Z");
    const line = document.getElementById("line");
    line.setAttribute("d", d);
    const head = document.getElementById("head");
    const live = document.getElementById("live");
    const target = 1720, floor = Math.round(target * 0.55);
    let mode = "lock";
    function show(which) {
      mode = which;
      document.getElementById("stage-lock").classList.toggle("hidden", which !== "lock");
      document.getElementById("stage-home").classList.toggle("hidden", which !== "home");
      if (which === "home") {
        line.classList.remove("animate");
        void line.getBoundingClientRect();
        line.classList.add("animate");
      }
    }
    show("lock");
    setInterval(() => show(mode === "lock" ? "home" : "lock"), 3200);
    const t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / 1000;
      const loop = 7;
      const p = (t % loop) / loop;
      let eased = p < 0.88
        ? (() => { const u = p / 0.88; return u * u * (3 - 2 * u); })()
        : (() => { const u = (p - 0.88) / 0.12; return 1 - u * u * (3 - 2 * u); })();
      live.textContent = "NT$" + Math.round(floor + (target - floor) * eased).toLocaleString("en-US");
      const ph = ((t % 4.5) / 4.5) * (pts.length - 1);
      const i = Math.floor(ph), u = ph - i;
      const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
      head.setAttribute("cx", (a[0] + (b[0] - a[0]) * u).toFixed(2));
      head.setAttribute("cy", (a[1] + (b[1] - a[1]) * u).toFixed(2));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
