<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<title>Inertia — Android widget mock</title>
<!--
  HTML mock of the native RemoteViews layouts
  (android/app/src/main/res/layout/widget_small.xml / widget_medium.xml).
  1 CSS px = 1 dp. Fed by the real snapshot builder (src/widgetSnapshot.js).
  Used by scripts/android-widget-shots.mjs for docs + widget picker previews.
-->
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: Roboto, "Noto Sans CJK TC", sans-serif; padding: 16px; }
  #stage { display: inline-flex; gap: 16px; align-items: flex-start; padding: 16px; }
  #stage.wall { background: linear-gradient(160deg, #8a9a8e 0%, #5f6f66 55%, #3f4a45 100%); }
  #stage.wall-dark { background: linear-gradient(160deg, #3a3f44 0%, #1d2024 100%); }
  .w { position: relative; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column;
       padding: 12px 14px; font-feature-settings: "tnum"; }
  .rule { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .head { display: flex; align-items: center; }
  .brand { flex: 1; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; }
  .upd { font-size: 9px; }
  .spacer { flex: 1; }
  .lab { font-size: 10px; line-height: 13px; }
  .val { font-size: 21px; font-weight: 500; line-height: 26px; height: 26px; white-space: nowrap; overflow: hidden; }
  .medium .val { font-size: 24px; height: 30px; line-height: 30px; }
  .pace { display: flex; gap: 4px; margin-top: 1px; font-size: 10px; line-height: 14px; white-space: nowrap; }
  .pace b { font-weight: 500; font-size: 10.5px; }
  canvas { display: block; }
  .rhythm { margin-top: 7px; }
  .medium .rhythm { margin-top: 8px; }
  .goal { margin-top: 6px; }
  .medium .goal { margin-top: 5px; }
  .goal .gt { font-size: 9.5px; line-height: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goal canvas { margin-top: 2px; }
  .cols { display: flex; }
  .left { flex: 1.15; min-width: 0; }
  .div { width: 1px; margin: 0 10px; }
  .right { flex: 1; min-width: 0; align-self: flex-end; }
  .brow { display: flex; font-size: 10px; line-height: 14px; margin-top: 2px; }
  .brow:first-child { margin-top: 0; }
  .brow span:last-child { flex: 1; text-align: right; font-size: 10.5px; white-space: nowrap; }
  .ph { font-size: 11px; line-height: 1.15; margin-bottom: 4px; }
  .cap { font: 11px/1.3 Roboto, "Noto Sans CJK TC", sans-serif; color: #fff; opacity: .85; margin-top: 6px; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./android-widget-mock.js"></script>
</body>
</html>
