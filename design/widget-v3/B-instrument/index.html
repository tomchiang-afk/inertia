<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inertia widget v3 · B · Instrument 儀表</title>
<style>
@font-face{font-family:"BSC";src:url(fonts/BarlowSemiCondensed-Light.ttf);font-weight:300}
@font-face{font-family:"BSC";src:url(fonts/BarlowSemiCondensed-Regular.ttf);font-weight:400}
@font-face{font-family:"BSC";src:url(fonts/BarlowSemiCondensed-Medium.ttf);font-weight:500}
@font-face{font-family:"BSC";src:url(fonts/BarlowSemiCondensed-SemiBold.ttf);font-weight:600}
@font-face{font-family:"BC";src:url(fonts/BarlowCondensed-Regular.ttf);font-weight:400}
@font-face{font-family:"BC";src:url(fonts/BarlowCondensed-Medium.ttf);font-weight:500}
@font-face{font-family:"ISerif";src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
:root{--tc:"Noto Sans TC","Noto Sans CJK TC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1b1c1e;color:#ddd;font-family:var(--tc)}
body.v-controls{display:flex;gap:28px;padding:24px;align-items:flex-start;justify-content:center;min-height:100vh}
body.v-phone,body.v-sheet,body.v-crop{background:transparent}

/* ---------- controls ---------- */
.panel{width:300px;font-size:13px;line-height:1.5;color:#c9c6bf}
.panel h1{font:italic 28px ISerif;color:#eee;margin-bottom:2px}
.panel h2{font-size:12px;letter-spacing:.12em;color:#8b8880;margin:18px 0 8px;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#2a2b2e;color:#d8d4cc;border:1px solid #3a3b3f;border-radius:8px;padding:6px 10px;font:13px var(--tc);cursor:pointer}
.seg button.on{background:#e9e4d8;color:#141517;border-color:#e9e4d8}
.panel p{color:#8f8b83;font-size:12px;margin-top:6px}
.panel code{font-family:"BC";color:#b9c9bd}

/* ---------- phone / wallpaper ---------- */
.phone{position:relative;width:412px;height:915px;border-radius:34px;overflow:hidden;flex:none;
  box-shadow:0 0 0 8px #0b0b0c,0 0 0 9px #333,0 30px 80px rgba(0,0,0,.5)}
body.v-phone .phone{box-shadow:none;border-radius:0}
.wall{position:absolute;inset:0}
.dark .wall{background:
  radial-gradient(120% 70% at 85% 8%,#3b4a57 0%,rgba(59,74,87,0) 55%),
  radial-gradient(90% 60% at 10% 55%,#4a3f36 0%,rgba(74,63,54,0) 60%),
  radial-gradient(120% 80% at 70% 95%,#1f3a37 0%,rgba(31,58,55,0) 60%),
  linear-gradient(170deg,#1c2229 0%,#15191d 50%,#101416 100%)}
.light .wall{background:
  radial-gradient(110% 70% at 90% 5%,#d9e2e4 0%,rgba(217,226,228,0) 55%),
  radial-gradient(90% 60% at 5% 50%,#e8d7c1 0%,rgba(232,215,193,0) 60%),
  radial-gradient(120% 80% at 75% 100%,#b9cbbf 0%,rgba(185,203,191,0) 60%),
  linear-gradient(170deg,#e7e3dc 0%,#d9d6cf 55%,#c9cdc6 100%)}
.wall::after{content:"";position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* soft wave shapes in wallpaper */
.wave{position:absolute;border-radius:50%;filter:blur(2px)}
.dark .wave{border:1px solid rgba(255,255,255,.05)}
.light .wave{border:1px solid rgba(40,50,45,.06)}
.status{position:absolute;top:0;left:0;right:0;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font:500 14px "Noto Sans","Noto Sans TC",sans-serif}
.dark .status,.dark .glance,.dark .lbl{color:#eef0ee}
.light .status,.light .glance,.light .lbl{color:#1d2320}
.status .ic{display:flex;gap:6px;align-items:center}
.glance{position:absolute;left:26px;top:66px}
.glance .d{font:400 24px "Noto Sans TC",sans-serif;letter-spacing:.01em}
.glance .wx{font:400 14px "Noto Sans TC",sans-serif;opacity:.85;margin-top:4px}
.app{position:absolute;width:88px;text-align:center}
.app .i{width:56px;height:56px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center}
.dark .app .i{background:#2b332f;color:#c8d5cb}
.light .app .i{background:#dbe4dc;color:#27352c}
.lbl{font:400 12px "Noto Sans TC",sans-serif;margin-top:7px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.search{position:absolute;left:16px;right:16px;top:846px;height:52px;border-radius:26px;display:flex;align-items:center;padding:0 18px;gap:12px}
.dark .search{background:#262d2a;color:#b9c4bd}
.light .search{background:#e4ebe5;color:#44524a}
.navh{position:absolute;bottom:8px;left:50%;width:108px;height:4px;margin-left:-54px;border-radius:2px}
.dark .navh{background:#eee}.light .navh{background:#222}

/* ---------- widget shell ---------- */
.w{position:absolute;border-radius:24px;overflow:hidden}
.w .case{position:absolute;inset:0}
.w svg{position:absolute;inset:0;overflow:visible}
.w .disc{position:absolute;border-radius:50%}
/* dark: brushed graphite case, sunburst lacquer dial */
.dark-w .case{background:
   repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,rgba(0,0,0,0) 1px 2px,rgba(0,0,0,.03) 2px 3px),
   linear-gradient(160deg,#202327 0%,#16181b 55%,#121416 100%);
   box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.5)}
.dark-w .disc{background:
   radial-gradient(circle at 34% 26%,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 46%),
   repeating-conic-gradient(from 0deg,rgba(255,255,255,.028) 0deg .45deg,rgba(0,0,0,0) .45deg 1.2deg),
   radial-gradient(circle,#121417 0%,#0c0e10 70%,#090a0c 100%);
   box-shadow:0 0 0 .6px rgba(255,255,255,.10),0 0 0 2.2px #0a0b0d,inset 0 1px 1px rgba(0,0,0,.6),inset 0 0 16px rgba(0,0,0,.55)}
/* light: porcelain / grand-feu enamel dial in a satin steel case */
.light-w .case{background:
   repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,rgba(0,0,0,0) 1px 2px,rgba(0,0,0,.012) 2px 3px),
   linear-gradient(160deg,#ebe7df 0%,#dfdad0 60%,#d6d0c5 100%);
   box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.06)}
.light-w .disc{background:
   radial-gradient(circle at 32% 24%,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 50%),
   radial-gradient(circle,#f8f5ee 0%,#f3efe6 70%,#ece6db 100%);
   box-shadow:0 0 0 .6px rgba(0,0,0,.10),0 0 0 2.2px #d2ccc1,inset 0 1px 2px rgba(0,0,0,.10),inset 0 0 14px rgba(120,100,70,.10)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.3' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.w .shadow{position:absolute;inset:0;border-radius:24px;pointer-events:none}
.dark .w{box-shadow:0 6px 18px rgba(0,0,0,.35)}
.light .w{box-shadow:0 6px 18px rgba(60,50,30,.16)}

/* aperture (ViewFlipper) */
.ap{position:absolute;overflow:hidden;border-radius:3px}
.dark-w .ap{background:#08090a;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 0 0 .6px rgba(255,255,255,.09)}
.light-w .ap{background:#fbf9f4;box-shadow:inset 0 1px 2px rgba(80,60,30,.22),0 0 0 .6px rgba(0,0,0,.12)}
.ap .fr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;will-change:transform}
.ap .k{font:400 6.6px var(--tc);letter-spacing:.02em}
.ap .v{font:500 8.6px BSC;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dark-w .ap .k{color:#8f8b82}.dark-w .ap .v{color:#e9e3d6}
.light-w .ap .k{color:#6a655c}.light-w .ap .v{color:#17191b}

/* sheet */
body.v-sheet .sheet{padding:28px 30px 34px;display:inline-block;position:relative;overflow:hidden}
.sheet .wallpad{position:absolute;inset:0}
.sheet .row{position:relative;display:flex;gap:20px;align-items:flex-start;margin-top:14px}
.sheet .tag{position:relative;font:500 12px var(--tc);letter-spacing:.08em;margin:18px 0 0 2px;display:flex;gap:10px;align-items:baseline}
.sheet .tag b{font:500 12px BC;letter-spacing:.16em;text-transform:uppercase}
.sheet h3{position:relative;font:italic 30px ISerif;font-weight:400}
.sheet .sub{position:relative;font:12px var(--tc);opacity:.7;margin-top:2px}
.sheet.dark h3,.sheet.dark .tag,.sheet.dark .sub{color:#e9e6de}
.sheet.light h3,.sheet.light .tag,.sheet.light .sub{color:#202421}
.slot{position:relative;flex:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =====================================================================
   Inertia widget v3 · Direction B · Instrument
   Everything static here is what the app would paint into ONE Bitmap
   (Canvas + bundled OFL fonts). The only things that move are the parts
   Android can move by itself inside RemoteViews:
     - .hand  → AnalogClock hour hand drawable  (floating growth index)
     - .sec   → AnalogClock second hand drawable (rim escapement, 1 Hz step)
     - .ap    → ViewFlipper, autoStart, flipInterval 6000, slide-up in/out 600ms
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const S = {
  theme: Q.get('theme') || 'dark',
  mode: Q.get('mode') || 'exact',
  view: Q.get('view') || 'controls',
  size: Q.get('size') || '4x2',
  capture: Q.has('capture'),
};
// fixed "now": Sun 27 Sep 2026 22:07:20 (Asia/Taipei); widget bitmap last redrawn 22:00 by periodic work
const BASE = new Date(2026, 8, 27, 22, 7, 20).getTime();
const D = {
  nw: 16470000, pace: 51600, perDay: 1720,
  day: 27, days: 30, redraw: 22 + 0/60, updated: '20:13',
  goal: { name: '換屋頭期款', short: '換屋', pct: 0.82 },
  cats: [
    { k: '房產', v: 12380000, sub: '市值 − 房貸' },
    { k: '股票', v: 2540000, sub: '台股 · 美股' },
    { k: '現金', v: 1550000, sub: 'TWD · USD · JPY' },
    { k: '被動', v: 28500, per: '/月', sub: '股息 · 利息 · 租金' },
  ],
  src: [ { k: '房貸還本', v: 32400 }, { k: '存款利息', v: 2100 }, { k: '股息', v: 17100 } ],
};
D.today = D.perDay * D.redraw / 24;                 // value printed at last redraw
D.monthFrac = (D.day - 1 + 22.1 / 24) / D.days;     // 0.897

const T = {
  dark:  { ink: '#ECE6D8', ink2: '#A29E94', ink3: '#6B6861', tick: '#8E8A81', hair: 'rgba(236,230,216,.16)', accent: '#9CC3A8', accentDim: 'rgba(156,195,168,.22)', lance: '#9CC3A8', dot: '#ECE6D8' },
  light: { ink: '#17191B', ink2: '#5F5B53', ink3: '#8F897E', tick: '#3B3D3F', hair: 'rgba(23,25,27,.16)', accent: '#2F5D4A', accentDim: 'rgba(47,93,74,.18)', lance: '#2F5D4A', dot: '#17191B' },
};

/* ---------- privacy formatting (mirrors widgetPrivacy.js semantics) ---------- */
const n0 = v => Math.round(v).toLocaleString('en-US');
const wan = v => (v >= 1e6 ? n0(v / 1e4) : (v / 1e4).toFixed(1)) + ' 萬';
function F(mode) {
  const share = v => (v / D.nw * 100).toFixed(1) + '%';
  return {
    exact:    { nwLabel: '淨資產', nwCur: 'NT$', nw: n0(D.nw), pace: '+NT$51.6k', paceNote: '本月', today: '+' + n0(D.today), todayUnit: 'NT$', cat: c => (c.per ? n0(c.v) : n0(c.v)), catCur: 'NT$', src: s => '+NT$' + (s.v / 1000).toFixed(1) + 'k', goal: '82%', scale: 'ntd', month: '90%' },
    rounded:  { nwLabel: '淨資產', nwCur: 'NT$', nw: wan(D.nw), pace: '+NT$5.2 萬', paceNote: '本月', today: '約 +' + n0(Math.round(D.today / 100) * 100), todayUnit: 'NT$', cat: c => wan(c.v), catCur: 'NT$', src: s => '+' + wan(s.v), goal: '82%', scale: 'ntd', month: '90%' },
    relative: { nwLabel: '本月進度', nwCur: '', nw: '90%', pace: '+0.31%', paceNote: '淨值', today: '+0.010%', todayUnit: '淨值', cat: c => (c.per ? '—' : share(c.v)), catCur: '', src: s => Math.round(s.v / D.pace * 100) + '%', goal: '82%', scale: 'pct', month: '90%' },
    rhythm:   { nwLabel: '本月節奏', nwCur: '', nw: null, pace: null, paceNote: '', today: null, todayUnit: '', cat: null, catCur: '', src: null, goal: null, scale: 'none', month: null },
    masked:   { nwLabel: '淨資產', nwCur: 'NT$', nw: '••••••', pace: '+••••', paceNote: '本月', today: '+••••', todayUnit: 'NT$', cat: () => '••••••', catCur: 'NT$', src: () => '+••••', goal: '••%', scale: 'mask', month: '••%', noGoalFill: true },
  }[mode];
}

/* ---------- geometry helpers ---------- */
const rad = a => (a - 90) * Math.PI / 180;
const P = (r, a) => [r * Math.cos(rad(a)), r * Math.sin(rad(a))];
const f2 = x => x.toFixed(2);
function arc(r, a0, a1) {
  const [x0, y0] = P(r, a0), [x1, y1] = P(r, a1);
  return `M${f2(x0)} ${f2(y0)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f2(x1)} ${f2(y1)}`;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

/* ---------- the dial (bitmap layer) ---------- */
// all radii designed for R = 86dp; k scales
function dialSVG(k, t, fm, opts = {}) {
  const c = T[S.theme === 'dark' ? 'dark' : 'light'];
  let s = '';
  // rim: 60-step escapement track
  for (let i = 0; i < 60; i++) {
    const a = i * 6, big = i % 5 === 0;
    const [x0, y0] = P((big ? 80.2 : 81.6) * k, a), [x1, y1] = P(84.2 * k, a);
    s += `<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="${big ? c.tick : c.ink3}" stroke-width="${big ? .9 : .5}"/>`;
  }
  s += `<circle r="${85 * k}" fill="none" stroke="${c.hair}" stroke-width=".5"/>`;
  s += `<circle r="${78.6 * k}" fill="none" stroke="${c.hair}" stroke-width=".5"/>`;
  // growth scale (tachymeter-like, non-uniform labels). Active half = PM (bitmap re-rendered at 00:00/12:00)
  const pm = true, lo = pm ? D.perDay / 2 : 0, hi = pm ? D.perDay : D.perDay / 2;
  const angOf = v => (v - lo) / (hi - lo) * 360;
  if (fm.scale === 'ntd' || fm.scale === 'mask') {
    for (let v = Math.ceil(lo / 20) * 20; v < hi; v += 20) {
      const a = angOf(v), maj = v % 100 === 0, lab = v % 200 === 0;
      const [x0, y0] = P((lab ? 71.5 : maj ? 73.5 : 75.5) * k, a), [x1, y1] = P(78.6 * k, a);
      s += `<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="${maj ? c.ink : c.ink3}" stroke-width="${lab ? 1.1 : maj ? .8 : .45}"/>`;
      if (lab) {
        const [tx, ty] = P(65.2 * k, a);
        const txt = fm.scale === 'mask' ? '••' : (fm.mode === 'rounded' ? (v / 1000).toFixed(1) + 'k' : n0(v));
        s += `<text x="${f2(tx)}" y="${f2(ty)}" dy="2.3" text-anchor="middle" transform="rotate(${f2(a > 90 && a < 270 ? a - 180 : a)} ${f2(tx)} ${f2(ty)})" font-family="BC" font-weight="500" font-size="${6.6 * k}" fill="${c.ink2}" letter-spacing=".2">${txt}</text>`;
      }
    }
  } else if (fm.scale === 'pct') {
    for (let p = 51; p < 100; p++) {
      const a = (p - 50) / 50 * 360, lab = p % 10 === 0, maj = p % 5 === 0;
      const [x0, y0] = P((lab ? 71.5 : maj ? 73.5 : 75.5) * k, a), [x1, y1] = P(78.6 * k, a);
      s += `<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="${maj ? c.ink : c.ink3}" stroke-width="${lab ? 1.1 : maj ? .8 : .45}"/>`;
      if (lab) {
        const [tx, ty] = P(65.2 * k, a);
        s += `<text x="${f2(tx)}" y="${f2(ty)}" dy="2.3" text-anchor="middle" transform="rotate(${f2(a > 90 && a < 270 ? a - 180 : a)} ${f2(tx)} ${f2(ty)})" font-family="BC" font-weight="500" font-size="${6.6 * k}" fill="${c.ink2}">${p}%</text>`;
      }
    }
  } else { // rhythm: uniform engraved minute-style ticks only
    for (let i = 0; i < 120; i++) {
      const a = i * 3, maj = i % 10 === 0;
      const [x0, y0] = P((maj ? 72 : 75.5) * k, a), [x1, y1] = P(78.6 * k, a);
      s += `<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="${maj ? c.ink : c.ink3}" stroke-width="${maj ? 1 : .45}"/>`;
    }
  }
  // 12 o'clock index: marks start of the half-day
  const [ix, iy] = P(78.6 * k, 0);
  s += `<path d="M${f2(ix - 2.2 * k)} ${f2(iy)} L${f2(ix + 2.2 * k)} ${f2(iy)} L${f2(ix)} ${f2(iy + 4 * k)}Z" fill="${c.ink}"/>`;
  // month ring (accent) & goal ring
  const mr = 57 * k, gr = 52.4 * k;
  s += `<circle r="${mr}" fill="none" stroke="${c.accentDim}" stroke-width="${2.2 * k}"/>`;
  for (let d = 0; d < D.days; d++) { // day notches on the month ring
    const [x0, y0] = P(mr + 1.8 * k, d / D.days * 360), [x1, y1] = P(mr + 3.2 * k, d / D.days * 360);
    s += `<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="${c.ink3}" stroke-width=".45"/>`;
  }
  s += `<path d="${arc(mr, 0, D.monthFrac * 360)}" fill="none" stroke="${c.accent}" stroke-width="${2.2 * k}" stroke-linecap="butt"/>`;
  s += `<circle r="${gr}" fill="none" stroke="${c.hair}" stroke-width="${1.1 * k}"/>`;
  if (!fm.noGoalFill) s += `<path d="${arc(gr, 0, D.goal.pct * 360)}" fill="none" stroke="${c.ink2}" stroke-width="${1.1 * k}"/>`;
  // goal end marker (small diamond)
  if (!fm.noGoalFill) { const [gx, gy] = P(gr, D.goal.pct * 360); s += `<rect x="${f2(gx - 1.6 * k)}" y="${f2(gy - 1.6 * k)}" width="${3.2 * k}" height="${3.2 * k}" transform="rotate(${D.goal.pct * 360 + 45} ${f2(gx)} ${f2(gy)})" fill="${c.ink}"/>`; }
  return s;
}
// floating growth index = AnalogClock hour hand drawable (transparent except the index)
function handSVG(k) {
  const c = T[S.theme];
  return `<line x1="0" y1="${-60 * k}" x2="0" y2="${-70.5 * k}" stroke="${c.lance}" stroke-width="${1.1 * k}"/>
    <path d="M0 ${-79.4 * k} L${2.1 * k} ${-71 * k} L0 ${-69.4 * k} L${-2.1 * k} ${-71 * k}Z" fill="${c.lance}"/>
    <circle cy="${-60 * k}" r="${1.25 * k}" fill="${c.lance}"/>`;
}
// escapement = AnalogClock second hand drawable (a single bead on the rim)
function secSVG(k) {
  const c = T[S.theme];
  return `<circle cy="${-82.6 * k}" r="${1.55 * k}" fill="${c.dot}"/>`;
}

/* ---------- widget builders ---------- */
function flipFrames(fm) {
  if (fm.src === null) return D.src.map(s => ({ k: s.k, v: '' }));
  return D.src.map(s => ({ k: s.k, v: fm.src(s) }));
}
function apHTML(x, y, w, h, frames) {
  return `<div class="ap" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">` +
    frames.map((f, i) => `<div class="fr" data-i="${i}"><span class="k">${esc(f.k)}</span>${f.v ? `<span class="v">${esc(f.v)}</span>` : ''}</div>`).join('') + `</div>`;
}
function text(x, y, str, o = {}) {
  return `<text x="${x}" y="${y}" ${o.anchor ? `text-anchor="${o.anchor}"` : ''} font-family="${o.ff || 'BSC'}" font-weight="${o.fw || 400}" font-size="${o.fs || 10}" fill="${o.fill}" ${o.ls ? `letter-spacing="${o.ls}"` : ''} ${o.fst ? `font-style="${o.fst}"` : ''} style="font-variant-numeric:tabular-nums">${esc(str)}</text>`;
}
const TC = '"Noto Sans TC","Noto Sans CJK TC",sans-serif';

function widget2x2(fm, x = 0, y = 0) {
  const W = 180, H = 190, cx = 90, cy = 98, k = 0.955, R = 85.4 * k;
  const c = T[S.theme];
  let g = '';
  // corners

const decel = p => 1 - (1 - p) * (1 - p);            // android DecelerateInterpolator(1.0)
const FLIP = 6000, ANIM = 600;
let lastT = 0;
function tick(elapsed) {
  lastT = elapsed;
  const now = new Date(BASE + elapsed);
  const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
  // AnalogClock: hour angle = (h + (m + s/60)/60) * 30 ; second hand steps once per second
  const ha = (h + (m + s / 60) / 60) * 30, sa = s * 6;
  document.querySelectorAll('.w').forEach(w => {
    const hand = w.querySelector('.hand'), sec = w.querySelector('.sec');
    const tr = hand.getAttribute('transform').replace(/rotate\([^)]*\)/, '');
    hand.setAttribute('transform', tr + `rotate(${ha.toFixed(3)})`);
    sec.setAttribute('transform', tr + `rotate(${sa})`);
    const frs = w.querySelectorAll('.ap .fr'); const N = frs.length;
    const n = Math.floor(elapsed / FLIP), ph = elapsed - n * FLIP, cur = n % N, prev = (n - 1 + N) % N;
    frs.forEach((f, i) => {
      let y = 100, a = 0;
      if (i === cur) { if (n > 0 && ph < ANIM) { const p = decel(ph / ANIM); y = (1 - p) * 100; a = p; } else { y = 0; a = 1; } }
      else if (i === prev && n > 0 && ph < ANIM) { const p = decel(ph / ANIM); y = -p * 100; a = 1 - p; }
      f.style.transform = `translateY(${y.toFixed(2)}%)`; f.style.opacity = a.toFixed(3);
