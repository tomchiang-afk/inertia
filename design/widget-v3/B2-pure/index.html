<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inertia widget v3 · B2 · Pure 極簡原生</title>
<style>
/* Mock stand-in for SF Pro (system): Inter (OFL). CJK: Noto Sans TC stands in for PingFang TC. */
@font-face{font-family:"InterV";src:url(fonts/Inter-Variable.ttf);font-weight:100 900}
:root{--sf:"InterV","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;--tc:"Noto Sans TC","Noto Sans CJK TC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;color:#ddd;font-family:var(--sf);-webkit-font-smoothing:antialiased}
body.v-controls{display:flex;gap:32px;padding:24px;justify-content:center;align-items:flex-start;min-height:100vh}
body.v-controls #root{display:contents}
body:not(.v-controls){background:transparent}
.num{font-feature-settings:"tnum" 1,"cv11" 1;font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
.panel{width:290px;font:13px/1.55 var(--sf);color:#c8c8cc}
.panel h1{font:700 26px var(--sf);color:#fff;letter-spacing:-.4px}
.panel h2{font:600 11px var(--sf);letter-spacing:.08em;color:#8e8e93;margin:18px 0 8px;text-transform:uppercase}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#2c2c2e;color:#e5e5ea;border:0;border-radius:9px;padding:6px 11px;font:500 13px var(--sf);cursor:pointer}
.seg button.on{background:#fff;color:#000}
.panel p{color:#98989d;font-size:12px;margin-top:6px}
.panel code{font:12px ui-monospace,monospace;color:#9fd4b5}

/* ---------- phone ---------- */
.phone{position:relative;width:430px;height:932px;border-radius:55px;overflow:hidden;flex:none;box-shadow:0 0 0 10px #0a0a0a,0 0 0 11px #3a3a3c,0 30px 90px rgba(0,0,0,.55)}
body.v-home .phone,body.v-lock .phone{border-radius:0;box-shadow:none}
.wall{position:absolute;inset:0}
.wp-light{background:
  radial-gradient(90% 55% at 15% 12%,#f6d9c8 0%,rgba(246,217,200,0) 60%),
  radial-gradient(80% 60% at 95% 35%,#cfd8f2 0%,rgba(207,216,242,0) 60%),
  radial-gradient(100% 60% at 30% 90%,#d7e8df 0%,rgba(215,232,223,0) 60%),
  linear-gradient(180deg,#efe7e3,#e3e6ef 55%,#dfe8e3)}
.wp-dark{background:
  radial-gradient(90% 55% at 15% 10%,#3b2a3a 0%,rgba(59,42,58,0) 60%),
  radial-gradient(80% 60% at 95% 40%,#1f2d4a 0%,rgba(31,45,74,0) 60%),
  radial-gradient(100% 60% at 30% 95%,#16322b 0%,rgba(22,50,43,0) 60%),
  linear-gradient(180deg,#171419,#101521 55%,#0d1614)}
.wp-tinted{background:
  radial-gradient(90% 55% at 20% 10%,#2a2319 0%,rgba(42,35,25,0) 60%),
  radial-gradient(90% 60% at 90% 60%,#1d1a14 0%,rgba(29,26,20,0) 60%),linear-gradient(180deg,#14120f,#0d0c0a)}
.wp-lock{background:
  radial-gradient(70% 45% at 70% 18%,#5b6f8f 0%,rgba(91,111,143,0) 70%),
  radial-gradient(90% 60% at 10% 70%,#6d5563 0%,rgba(109,85,99,0) 65%),
  radial-gradient(100% 50% at 60% 100%,#2d4a44 0%,rgba(45,74,68,0) 70%),
  linear-gradient(180deg,#26324a,#2b2533 55%,#1a2624)}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0 50px;font:600 17px var(--sf);letter-spacing:-.2px}
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;background:#000;border-radius:20px}
.light-ui{color:#000}.dark-ui{color:#fff}
.status .ic{display:flex;gap:6px;align-items:center}
.app{position:absolute;width:64px;text-align:center}
.app .i{width:64px;height:64px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.app .l{font:500 12px var(--sf);margin-top:5px;white-space:nowrap;margin-left:-10px;margin-right:-10px}
.light-ui .app .l{color:#1c1c1e}.dark-ui .app .l,.tint-ui .app .l{color:#fff}
.tint-ui .app .i{background:#1d1b17 !important;color:#EBC98F}
.clear-ui .app .i{background:rgba(255,255,255,.16) !important;backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.35)}
.searchp{position:absolute;left:50%;top:770px;width:86px;height:30px;margin-left:-43px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:5px;font:500 13px var(--sf)}
.light-ui .searchp{background:rgba(255,255,255,.45);color:#3a3a3c;backdrop-filter:blur(20px)}
.dark-ui .searchp,.tint-ui .searchp,.clear-ui .searchp{background:rgba(255,255,255,.14);color:#f2f2f7;backdrop-filter:blur(20px)}
.dock{position:absolute;left:14px;right:14px;top:814px;height:96px;border-radius:38px;backdrop-filter:blur(26px) saturate(1.6)}
.light-ui .dock{background:rgba(255,255,255,.38)}
.dark-ui .dock,.tint-ui .dock,.clear-ui .dock{background:rgba(255,255,255,.12)}
.homebar{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px}
.light-ui .homebar{background:#000}.dark-ui .homebar,.tint-ui .homebar,.clear-ui .homebar,.lock-ui .homebar{background:#fff}

/* ---------- widget container (containerBackground) ---------- */
.wg{position:absolute;border-radius:22px;overflow:hidden;font-family:var(--sf)}
.wg.light{background:linear-gradient(180deg,#FFFFFF 0%,#F4F5F3 100%);color:#000;box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(40,40,60,.08)}
.wg.dark{background:linear-gradient(180deg,#232325 0%,#161618 100%);color:#fff}
.wg.tinted{background:linear-gradient(180deg,#1f1d19 0%,#171512 100%);color:#EBC98F}
.wg.clear{background:rgba(255,255,255,.10);backdrop-filter:blur(22px) saturate(1.5);color:#fff;box-shadow:inset 0 0 0 .6px rgba(255,255,255,.34),inset 0 1px 0 rgba(255,255,255,.28)}
.wg .pad{position:absolute;inset:16px;display:flex;flex-direction:column}
/* semantic colours */
.light{--p:#000;--s:rgba(60,60,67,.60);--t:rgba(60,60,67,.30);--track:rgba(60,60,67,.12);--acc:#2E7D5B;--sep:rgba(60,60,67,.12)}
.dark{--p:#fff;--s:rgba(235,235,245,.60);--t:rgba(235,235,245,.30);--track:rgba(235,235,245,.14);--acc:#5DC596;--sep:rgba(235,235,245,.10)}
.tinted{--p:#EBC98F;--s:rgba(235,201,143,.58);--t:rgba(235,201,143,.30);--track:rgba(235,201,143,.16);--acc:#EBC98F;--sep:rgba(235,201,143,.14)}
.clear{--p:#fff;--s:rgba(255,255,255,.66);--t:rgba(255,255,255,.36);--track:rgba(255,255,255,.22);--acc:#fff;--sep:rgba(255,255,255,.16)}
.vib{--p:rgba(255,255,255,.96);--s:rgba(255,255,255,.62);--t:rgba(255,255,255,.34);--track:rgba(255,255,255,.24);--acc:#fff;--sep:rgba(255,255,255,.18)}

.lab{font:600 13px var(--sf);color:var(--s);letter-spacing:-.08px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.lab .cur{font-weight:500;color:var(--t)}
.hero{font-weight:600;color:var(--p);letter-spacing:-.6px;line-height:1.05;white-space:nowrap}
.pace{font:600 13px var(--sf);color:var(--acc);display:flex;gap:4px;align-items:center;white-space:nowrap}
.pace .n{color:var(--s);font-weight:500}
.row{display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap}
.foot{font:600 12px var(--sf);color:var(--p)}
.foot .k{color:var(--s);font-weight:500;margin-right:4px}
.foot .timer{color:var(--s);font-weight:500}
.line{position:relative;height:2px;border-radius:1px;background:var(--track);margin-top:7px;overflow:hidden}
.line i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:1px}
.ticks{position:relative;height:4px;margin-top:3px}
.ticks b{position:absolute;top:0;width:1px;height:3px;background:var(--t)}
.cats{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.cat{display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap}
.cat .k{font:500 13px var(--sf);color:var(--s)}
.cat .v{font:600 15px var(--sf);color:var(--p);letter-spacing:-.2px}
.cat .v small{font-size:11px;color:var(--s);font-weight:500;margin-left:1px}
.vsep{width:.5px;background:var(--sep);align-self:stretch;margin:2px 0}
.days{display:flex;gap:2.2px;margin-top:10px}
.days i{flex:1;height:14px;border-radius:2px;background:var(--track)}
.days i.on{background:var(--s)}
.days i.today{background:var(--acc)}
/* rolling digits (.contentTransition(.numericText())) */
.roll{display:inline-flex;align-items:baseline}
.roll .d{position:relative;display:inline-block;overflow:visible}
.roll .d .o{position:absolute;left:0;top:0}

/* ---------- lock screen ---------- */
.lockdate{position:absolute;top:78px;left:0;right:0;text-align:center;font:600 21px var(--sf);color:rgba(255,255,255,.92);letter-spacing:-.1px}
.lockdate .inl{opacity:.92;font-weight:600}
.locktime{position:absolute;top:92px;left:0;right:0;text-align:center;font:600 112px/1 var(--sf);color:rgba(255,255,255,.93);letter-spacing:-3px}
.acc{position:absolute}
.acc.circ{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(18px)}
.acc.rect{width:172px;height:76px}
.lbtn{position:absolute;top:824px;width:50px;height:50px;border-radius:25px;background:rgba(40,40,46,.45);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;color:#fff}

/* sheet */
.sheet{position:relative;display:inline-block;padding:30px 32px 36px;overflow:hidden}
.sheet h3{position:relative;font:700 28px var(--sf);letter-spacing:-.5px}
.sheet .sub{position:relative;font:500 13px var(--sf);opacity:.6;margin-top:3px}
.sheet .mode{position:relative;display:flex;gap:10px;align-items:baseline;font:600 13px var(--sf);margin:22px 0 10px}
.sheet .mode span{opacity:.55;font-weight:500}
.sheet .r{position:relative;display:flex;gap:18px;align-items:center}
.slot{position:relative;flex:none}
.lockstrip{position:relative;border-radius:22px;overflow:hidden;width:374px;height:170px}
.accel{position:absolute;top:700px;right:33px;font:600 11px var(--sf);padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;letter-spacing:.02em;backdrop-filter:blur(10px)}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =====================================================================
   Inertia widget v3 · B2 · Pure
   Motion in this mock = exactly what WidgetKit renders by itself:
   [data-roll]  → Text(value).contentTransition(.numericText(value:)) : rolls when a new timeline entry lands (every 15 min)
   [data-timer] → Text(endOfDay, style: .timer)                        : ticks every second, system-driven
   [data-day]   → ProgressView(timerInterval: startOfDay...endOfDay)    : fills continuously, system-driven
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const S = { app: Q.get('app') || 'light', mode: Q.get('mode') || 'exact', view: Q.get('view') || 'controls', accel: +(Q.get('accel') || 1), capture: Q.has('capture') };
const BASE = new Date(2026, 8, 27, 22, 7, 20).getTime();       // Sun 27 Sep 2026 22:07:20 Taipei
const DAY0 = new Date(2026, 8, 27, 0, 0, 0).getTime();
const ENTRY = 15 * 60 * 1000, ROLL_MS = 520;
const D = { nw2200: 16470000, perDay: 1720, pace: 51600, day: 27, days: 30,
  goal: { name: '換屋頭期款', short: '換屋', pct: .82 },
  cats: [{ k: '房產', v: 12380000 }, { k: '股票', v: 2540000 }, { k: '現金', v: 1550000 }, { k: '被動', v: 28500, per: '/月' }] };
const n0 = v => Math.round(v).toLocaleString('en-US');
const wan = v => (v >= 1e6 ? n0(v / 1e4) : (v / 1e4).toFixed(1)) + ' 萬';

/* value model per timeline entry */
function entryAt(vt) { const e = Math.floor((vt - DAY0) / ENTRY); return { e, t: DAY0 + e * ENTRY }; }
function values(et) {
  const hrs = (et - DAY0) / 3600e3;
  return { nw: D.nw2200 + D.perDay * (hrs - 22) / 24, today: D.perDay * hrs / 24, pace: D.pace + D.perDay * (hrs - 22) / 24 };
}
function fmt(mode, key, v) {
  const M = {
    exact:    { nw: () => n0(v.nw), nwLab: '淨資產', cur: 'NT$', pace: () => '+NT$' + (v.pace / 1000).toFixed(1) + 'k', today: () => '+' + n0(v.today), todayCur: () => '+NT$' + n0(v.today), cat: c => n0(c.v), circ: () => '51.6k', goal: '82%' },
    rounded:  { nw: () => wan(v.nw), nwLab: '淨資產', cur: 'NT$', pace: () => '+' + wan(v.pace), today: () => '約 +' + n0(Math.round(v.today / 100) * 100), todayCur: () => '約 +NT$' + n0(Math.round(v.today / 100) * 100), cat: c => wan(c.v), circ: () => '5 萬', goal: '82%' },
    relative: { nw: () => '+0.31%', nwLab: '本月淨值', cur: '', pace: () => '本月進度 90%', today: () => '+' + (v.today / v.nw * 100).toFixed(3) + '%', todayCur: () => '+' + (v.today / v.nw * 100).toFixed(3) + '%', cat: c => c.per ? '—' : (c.v / D.nw2200 * 100).toFixed(1) + '%', circ: () => '0.31%', goal: '82%' },
    rhythm:   { nw: null, nwLab: '本月節奏', cur: '', pace: null, today: null, todayCur: () => '靜默成長中', cat: null, circ: null, goal: null },
    masked:   { nw: () => '••••••', nwLab: '淨資產', cur: 'NT$', pace: () => '+NT$••••', today: () => '+••••', todayCur: () => '+NT$••••', cat: () => '••••', circ: () => '••', goal: '••%' },
  }[mode];
  return M;
}

/* ---------- small pieces ---------- */
const roll = (key, cls = '', style = '') => `<span class="roll num ${cls}" data-roll="${key}" style="${style}"></span>`;
const ticksHTML = () => [6, 12, 18].map(h => `<b style="left:${h / 24 * 100}%"></b>`).join('');
const dayLine = (withTicks = true) => `<div class="line"><i data-day style="width:0"></i></div>${withTicks ? `<div class="ticks">${ticksHTML()}</div>` : ''}`;
const glyph = s => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" style="flex:none"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".35"/><path d="M8 1.8A6.2 6.2 0 0 1 14.2 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const monthDays = () => `<div class="days">${Array.from({ length: D.days }, (_, i) => `<i class="${i < D.day - 1 ? 'on' : i === D.day - 1 ? 'today' : ''}"></i>`).join('')}</div>`;

function small(app, mode, x, y) {
  const f = fmt(mode, 0, values(BASE));
  let mid;
  if (f.nw) {
    mid = `<div class="lab">${glyph(12)}<span>${f.nwLab}</span>${f.cur ? `<span class="cur">${f.cur}</span>` : ''}</div>
      <div class="hero" style="font-size:${mode === 'relative' ? 30 : 24}px;margin-top:6px">${roll('nw')}</div>
      <div class="pace" style="margin-top:4px">${mode === 'relative' ? `<span class="n">本月進度 90%</span>` : `${roll('pace')}<span class="n">本月</span>`}</div>`;
  } else {
    mid = `<div class="lab">${glyph(12)}<span>${f.nwLab}</span></div>
      <div class="hero" style="font-size:22px;margin-top:6px;letter-spacing:-.3px">靜默成長中</div>${monthDays()}`;
  }
  const foot = f.today
    ? `<div class="row foot"><span><span class="k">今日</span>${roll('today')}</span><span class="timer num" data-timer></span></div>`
    : `<div class="row foot"><span class="k">今日</span><span class="timer num" data-timer></span></div>`;
  return `<div class="wg ${app}" data-mode="${mode}" style="left:${x}px;top:${y}px;width:170px;height:170px"><div class="pad">${mid}<div style="flex:1"></div>${foot}${dayLine()}</div></div>`;
}

function medium(app, mode, x, y) {
  const f = fmt(mode, 0, values(BASE));
  let left;
  if (f.nw) {
    left = `<div class="lab">${glyph(12)}<span>${f.nwLab}</span>${f.cur ? `<span class="cur">${f.cur}</span>` : ''}</div>
      <div class="hero" style="font-size:${mode === 'relative' ? 34 : 30}px;margin-top:7px">${roll('nw')}</div>
      <div class="pace" style="margin-top:5px">${mode === 'relative' ? `<span class="n">本月進度 90%</span>` : `${roll('pace')}<span class="n">本月</span>`}</div>`;
  } else {
    left = `<div class="lab">${glyph(12)}<span>${f.nwLab}</span></div>
      <div class="hero" style="font-size:26px;margin-top:7px;letter-spacing:-.3px">靜默成長中</div>
      <div class="pace" style="margin-top:6px"><span class="n">第 ${D.day} 天 · 共 ${D.days} 天</span></div>`;
  }
  let right;
  if (f.cat) right = `<div class="cats">${D.cats.map(c => { const v = f.cat(c); return `<div class="cat"><span class="k">${c.k}</span><span class="v num">${v}${c.per && v !== '—' ? `<small>${c.per}</small>` : ''}</span></div>`; }).join('')}</div>`;
  else right = `<div class="cats" style="justify-content:flex-start"><div class="cat"><span class="k">本月</span><span class="v num" style="font-size:13px;color:var(--s)">${D.day}/${D.days}</span></div>${monthDays().replace('margin-top:10px', '')}<div class="cat" style="margin-top:auto"><span class="k">${D.goal.name}</span><span class="v" style="font-size:13px;color:var(--s)">進行中</span></div></div>`;
  const foot = f.today
    ? `<div class="row foot"><span><span class="k">今日靜默成長</span>${roll('todayCur')}</span><span><span class="k">今日結算</span><span class="timer num" data-timer></span></span></div>`
    : `<div class="row foot"><span class="k">今日</span><span><span class="k">今日結算</span><span class="timer num" data-timer></span></span></div>`;
  return `<div class="wg ${app}" data-mode="${mode}" style="left:${x}px;top:${y}px;width:364px;height:170px"><div class="pad">
    <div style="display:flex;gap:14px;flex:1;min-height:0"><div style="flex:1.35;min-width:0">${left}</div><div class="vsep"></div><div style="flex:1;min-width:0;padding:1px 0 4px">${right}</div></div>
    <div style="height:12px"></div>${foot}${dayLine()}</div></div>`;
}

/* lock-screen accessories (vibrant rendering) */
function accRect(mode, x, y) {
  const f = fmt(mode, 0, values(BASE));
  const hero = f.nw ? `<div class="hero" style="font-size:${mode === 'relative' ? 22 : 20}px;margin-top:1px">${f.cur && mode !== 'relative' ? `<span style="font-size:13px;font-weight:600;color:var(--s);margin-right:2px">${f.cur}</span>` : ''}${roll('nw')}</div>`
    : `<div class="hero" style="font-size:18px;margin-top:2px;letter-spacing:-.2px">靜默成長中</div>`;
  return `<div class="acc rect vib" data-mode="${mode}" style="left:${x}px;top:${y}px"><div style="display:flex;flex-direction:column;height:100%;justify-content:center">
    <div class="lab" style="color:var(--p);font-size:13px">${glyph(11)}<span>Inertia</span><span style="color:var(--s);font-weight:500">${f.nwLab}</span></div>${hero}
    <div class="row foot" style="margin-top:3px;font-size:12px"><span>${f.today ? `<span class="k">今日</span>${roll('today')}` : '<span class="k">今日</span>'}</span><span class="timer num" data-timer style="color:var(--s)"></span></div>
    <div class="line" style="margin-top:4px;height:2.5px"><i data-day></i></div></div></div>`;
}
function ringSVG(frac, size = 76, w = 5.5) {
  const r = size / 2 - w / 2 - 3, C = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${w}"/>${frac > 0 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--p)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(C * frac).toFixed(2)} ${C.toFixed(2)}"/>` : ''}</svg>`;
}
function accCirc(kind, mode, x, y) {
  const f = fmt(mode, 0, values(BASE));
  let frac, top, mid;
  if (kind === 'month') { frac = (D.day - 1 + 22.1 / 24) / D.days; top = '本月'; mid = f.circ ? f.circ() : `${D.day}`; }
  else { frac = mode === 'masked' ? 0 : D.goal.pct; top = D.goal.short; mid = f.goal ? f.goal : ''; }
  const small = mid.length > 4;
  return `<div class="acc circ vib" style="left:${x}px;top:${y}px">${ringSVG(frac)}
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <div style="font:600 10px var(--sf);color:var(--s)">${top}</div>
    <div class="num" style="font:700 ${small ? 13 : 17}px var(--sf);color:var(--p);letter-spacing:-.3px;margin-top:-1px">${mid || glyph(16)}</div></div></div>`;
}
function inlineText(mode) {
  const f = fmt(mode, 0, values(entryAt(BASE).t));
  return f.today ? `今日 ${f.todayCur()}` : '靜默成長中';
}

/* ---------- screens ---------- */
const GL = {

const app = (x, y, g, l) => `<div class="app" style="left:${x}px;top:${y}px"><div class="i" style="background:${ICOL[g]}"><svg width="30" height="30" viewBox="0 0 24 24">${GL[g]}</svg></div>${l ? `<div class="l">${l}</div>` : ''}</div>`;

  <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2A10.5 10.5 0 008.5.6 10.5 10.5 0 001 3.6l1.2 1.2a8.8 8.8 0 016.3-2.5zm0 3.4c1.5 0 2.9.6 3.9 1.5l1.2-1.2a7.3 7.3 0 00-10.2 0l1.2 1.2c1-.9 2.4-1.5 3.9-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.7c.4-.4.9-.6 1.5-.6z" fill="currentColor"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg></span></div>`;

function homeHTML() {
  const a = S.app, ui = a === 'light' ? 'light-ui' : a === 'dark' ? 'dark-ui' : a === 'tinted' ? 'tint-ui' : 'clear-ui';
  const wp = a === 'light' ? 'wp-light' : a === 'dark' ? 'wp-dark' : a === 'tinted' ? 'wp-tinted' : 'wp-lock';
  const X = [33, 133, 233, 333];
  return `<div class="phone ${ui}"><div class="wall ${wp}"></div>${statusBar()}
    ${small(a, S.mode, 33, 70)}
    ${app(X[2], 72, 'cal', '行事曆')}${app(X[3], 72, 'photo', '照片')}
    ${app(X[2], 170, 'bus', '台北等公車')}${app(X[3], 170, 'wallet', '錢包')}
    ${medium(a, S.mode, 33, 272)}
    ${app(X[0], 474, 'map', '地圖')}${app(X[1], 474, 'note', '備忘錄')}${app(X[2], 474, 'clock', '時鐘')}${app(X[3], 474, 'gear', '設定')}
    ${app(X[0], 572, 'cam', '相機')}${app(X[1], 572, 'music', '音樂')}
    <div class="searchp"><svg width="12" height="12" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>搜尋</div>
    <div class="dock"></div>${app(X[0], 830, 'phone')}${app(X[1], 830, 'msg')}${app(X[2], 830, 'web')}${app(X[3], 830, 'cam')}
    <div class="homebar"></div>${S.accel > 1 ? `<div class="accel">時間加速 ×${S.accel}</div>` : ''}</div>`;
}
function lockHTML() {
  return `<div class="phone lock-ui"><div class="wall wp-lock"></div><div class="dark-ui">${statusBar()}</div>
    <div class="lockdate">9月27日 星期日 <span class="inl">· ${glyph(15).replace('<svg', '<svg style="vertical-align:-2px"')} ${inlineText(S.mode)}</span></div>
    <div class="locktime num" style="top:112px">22:07</div>
    ${accCirc('month', S.mode, 40, 262)}${accCirc('goal', S.mode, 128, 262)}${accRect(S.mode, 222, 262)}
    <div class="lbtn" style="left:46px"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M9 2h6v5l-2 3v11h-2V10L9 7z" fill="currentColor"/></svg></div>
    <div class="lbtn" style="right:46px"><svg width="22" height="22" viewBox="0 0 24 24">${GL.cam}</svg></div>
    <div class="homebar"></div>${S.accel > 1 ? `<div class="accel">時間加速 ×${S.accel}</div>` : ''}</div>`;
}
const MODES = [['exact', '精確', 'Exact'], ['rounded', '約略 萬', 'Rounded'], ['relative', '相對 %', 'Relative'], ['rhythm', '僅節奏', 'Rhythm-only'], ['masked', '遮蔽', 'Masked']];
function sheetHTML() {
  const a = S.app, dark = a !== 'light';
  let rows = '';
  for (const [m, zh, en] of MODES) {
    rows += `<div class="mode">${en}<span>${zh}</span></div><div class="r">
      <div class="slot" style="width:170px;height:170px">${small(a, m, 0, 0)}</div>
      <div class="slot" style="width:364px;height:170px">${medium(a, m, 0, 0)}</div>
      <div class="lockstrip"><div class="wall wp-lock"></div>${accCirc('month', m, 16, 20)}${accCirc('goal', m, 100, 20)}${accRect(m, 184, 20)}
        <div style="position:absolute;left:18px;right:10px;top:118px;font:600 15px var(--sf);color:rgba(255,255,255,.92);white-space:nowrap">週日 27 · ${glyph(13).replace('<svg', '<svg style="vertical-align:-1px"')} ${inlineText(m)}</div></div>
    </div>`;
  }
  return `<div class="sheet" style="color:${dark ? '#fff' : '#000'}"><div class="wall ${dark ? 'wp-dark' : 'wp-light'}"></div><h3>Inertia · Pure</h3><div class="sub">五種隱私模式 · systemSmall · systemMedium · 鎖定畫面 circular / rectangular / inline</div>${rows}</div>`;
}
function renderingsHTML() { // light / dark / tinted / clear side by side
  const keep = S.app; let out = '';
  for (const [a, l] of [['light', '淺色'], ['dark', '深色'], ['tinted', '染色 · iOS 18'], ['clear', '透明 · iOS 26']]) {
    S.app = a;
    out += `<div style="position:relative;width:404px;height:440px;overflow:hidden;border-radius:28px"><div class="wall ${a === 'light' ? 'wp-light' : a === 'dark' ? 'wp-dark' : a === 'tinted' ? 'wp-tinted' : 'wp-lock'}"></div>
      <div style="position:absolute;left:20px;top:16px;font:600 13px var(--sf);color:${a === 'light' ? '#000' : '#fff'};opacity:.7">${l}</div>
      ${small(a, S.mode, 20, 46)}${medium(a, S.mode, 20, 250)}</div>`;
  }
  S.app = keep;
  return `<div style="display:grid;grid-template-columns:404px 404px;gap:14px;padding:14px;background:#0c0c0d">${out}</div>`;
}

/* ---------- controls + render ---------- */
function controlsHTML() {
  const b = (g, v, l) => `<button data-g="${g}" data-v="${v}" class="${String(S[g]) === String(v) ? 'on' : ''}">${l}</button>`;
  return `<div class="panel"><h1>Inertia</h1><div>Widget v3 · B2 · Pure 極簡原生</div>
    <h2>外觀</h2><div class="seg">${b('app', 'light', '淺色')}${b('app', 'dark', '深色')}${b('app', 'tinted', '染色 iOS 18')}${b('app', 'clear', '透明 iOS 26')}</div>
    <h2>隱私模式</h2><div class="seg">${MODES.map(([m, zh]) => b('mode', m, zh)).join('')}</div>
    <h2>畫面</h2><div class="seg">${b('view', 'controls', '主畫面')}${b('view', 'lockc', '鎖定畫面')}${b('view', 'sheet', '模式總表')}${b('view', 'renderings', '四種渲染')}</div>
    <h2>時間</h2><div class="seg">${b('accel', 1, '實際')}${b('accel', 60, '×60')}${b('accel', 360, '×360')}</div>
    <h2>WidgetKit 動態</h2>
    <p><b>數字滾動</b>：每 15 分鐘一筆 timeline entry，淨資產與今日靜默成長用 <code>.contentTransition(.numericText(value:))</code> 往上滾。</p>
    <p><b>日線</b>：<code>ProgressView(timerInterval: 今日 0:00...24:00)</code>，由系統連續填滿，不需要更新。</p>
    <p><b>今日結算</b>：<code>Text(endOfDay, style: .timer)</code> 每秒倒數。</p></div>`;
}
function render() {
  const root = document.getElementById('root');
  const v = S.view;
  document.body.className = 'v-' + (v === 'lockc' ? 'controls' : v);
  let html;
  if (v === 'controls') html = controlsHTML() + homeHTML();
  else if (v === 'lockc') html = controlsHTML() + lockHTML();
  else if (v === 'home') html = homeHTML();
  else if (v === 'lock') html = lockHTML();
  else if (v === 'sheet') html = sheetHTML();
  else if (v === 'renderings') html = renderingsHTML();
  root.innerHTML = html;
  document.querySelectorAll('[data-g]').forEach(el => el.onclick = () => { const g = el.dataset.g; S[g] = g === 'accel' ? +el.dataset.v : el.dataset.v; t0 = performance.now(); render(); });
  tick(lastT);
}

/* ---------- motion ---------- */
const ease = p => 1 - Math.pow(1 - p, 3);
function rollHTML(s0, s1, p) {
  const L = Math.max(s0.length, s1.length); s0 = s0.padStart(L, ' '); s1 = s1.padStart(L, ' ');
  let out = '';
  for (let i = 0; i < L; i++) {
    const a = s0[i], b = s1[i];
    if (a === b || p >= 1) { out += `<span class="d">${b === ' ' ? '' : b}</span>`; continue; }
    const e = ease(p);
    out += `<span class="d"><span style="display:inline-block;transform:translateY(${((1 - e) * .72).toFixed(3)}em);opacity:${e.toFixed(3)};filter:blur(${((1 - e) * 1.6).toFixed(2)}px)">${b === ' ' ? '' : b}</span><span class="o" style="transform:translateY(${(-e * .72).toFixed(3)}em);opacity:${(1 - e).toFixed(3)};filter:blur(${(e * 1.6).toFixed(2)}px)">${a === ' ' ? '' : a}</span></span>`;
  }
  return out;
}
let lastT = 0, t0 = performance.now();
function tick(elapsed) {
  lastT = elapsed;
  const vt = BASE + elapsed * S.accel;
  const cur = entryAt(vt), prev = entryAt(cur.t - 1);
  const sinceEntryReal = (vt - cur.t) / S.accel;            // the roll plays in real time when the entry lands
  const p = Math.min(1, sinceEntryReal / ROLL_MS);
  const v1 = values(cur.t), v0 = values(prev.t);
  document.querySelectorAll('[data-roll]').forEach(el => {
    const mode = el.closest('[data-mode]').dataset.mode;
    const f1 = fmt(mode, 0, v1), f0 = fmt(mode, 0, v0), k = el.dataset.roll;
    const s1 = f1[k] ? f1[k]() : '', s0 = f0[k] ? f0[k]() : s1;
    el.innerHTML = rollHTML(s0, s1, p);
  });
  const left = Math.max(0, DAY0 + 86400e3 - vt), hh = Math.floor(left / 3600e3), mm = Math.floor(left / 60e3) % 60, ss = Math.floor(left / 1e3) % 60;
  const timer = `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  document.querySelectorAll('[data-timer]').forEach(el => el.textContent = timer);
  const frac = ((vt - DAY0) / 86400e3 * 100).toFixed(3) + '%';
  document.querySelectorAll('[data-day]').forEach(el => el.style.width = frac);
}
window.__setT = ms => tick(ms);
window.__ready = document.fonts.ready;
render();
if (!S.capture) { const loop = () => { tick(performance.now() - t0); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
