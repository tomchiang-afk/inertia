# The XcodeGen project uses a project format newer than Xcode 15.4,
# so this job runs on the macOS 15 image with Xcode 16.
name: iOS widget

on:
  workflow_dispatch:
  push:
    paths:
      - "native/ios-widget/**"
      - ".github/workflows/ios-widget.yml"

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: native/ios-widget
        run: xcodegen generate
      - name: Build for simulator (no signing)
        working-directory: native/ios-widget
        run: >
          xcodebuild
          -project InertiaWidget.xcodeproj
          -scheme InertiaHost
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
